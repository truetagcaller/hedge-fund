[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hedgefund"
version = "1.0.0"
description = "AI-Powered Options Trading Agent"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "structlog>=23.2",
    # Data
    "pandas>=2.1",
    "numpy>=1.26",
    "aiohttp>=3.9",
    "websockets>=12.0",
    "redis>=5.0",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    # Technical Analysis
    "ta>=0.11",
    "scipy>=1.11",
    # ML / AI
    "scikit-learn>=1.3",
    "torch>=2.1",
    "transformers>=4.36",
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    # Backtesting
    "vectorbt>=0.26",
    # Dashboard
    "fastapi>=0.108",
    "uvicorn>=0.25",
    # Broker SDKs
    "alpaca-py>=0.21",
    "ib_insync>=0.9",
    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.26",
    "orjson>=3.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.1",
    "black>=23.12",
]

[project.scripts]
hedgefund = "hedgefund.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
